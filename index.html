<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Jabones Artesanales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="grain"></div>

    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-filter="todos">Todos</button>
    <button class="tab" data-filter="aromas">Aromas</button>
    <button class="tab" data-filter="recuerditos">Recuerditos para Eventos</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <div class="hero-divider" aria-hidden="true">
      <svg viewBox="0 0 120 20" width="120" height="20"><path d="M0 10 Q 30 0, 60 10 T 120 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </div>

    <a id="footer-wa" class="footer-cta" href="#" target="_blank" rel="noopener">Contactar por WhatsApp</a>
