  <div class="lang-switch" id="langSwitch">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="de">DE</button>
  </div>

  <header class="hero">
    <p class="eyebrow" data-i18n="eyebrow">Hecho a mano &middot; Glicerina vegetal</p>
    <h1 id="business-name" data-i18n="businessName">Jabones Artesanales</h1>
    <p class="hero-sub" data-i18n="heroSub">Jabones naturales con formas y aromas para regalar, celebrar y disfrutar</p>
    <div class="trust-badges">
      <span><svg class="icon"><use href="#icon-leaf"/></svg> <span data-i18n="badge1">100% vegetal</span></span>
      <span><svg class="icon"><use href="#icon-gift"/></svg> <span data-i18n="badge2">Para regalar</span></span>
      <span><svg class="icon"><use href="#icon-sparkle"/></svg> <span data-i18n="badge3">Hecho a mano</span></span>
    </div>
    <div class="hero-divider" aria-hidden="true">
      <svg viewBox="0 0 120 20" width="120" height="20"><path d="M0 10 Q 30 0, 60 10 T 120 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </div>
  </header>

  <section class="carousel" id="carousel" aria-roledescription="carrusel" aria-label="Jabones destacados">
    <div class="carousel-viewport">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
    <button class="carousel-arrow prev" id="carousel-prev" aria-label="Anterior">&#10094;</button>
    <button class="carousel-arrow next" id="carousel-next" aria-label="Siguiente">&#10095;</button>
    <div class="carousel-dots" id="carousel-dots"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-filter="todos">Todos</button>
    <button class="tab" data-filter="aromas">Aromas</button>
    <button class="tab" data-filter="recuerditos">Recuerditos para Eventos</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <div class="hero-divider" aria-hidden="true">
      <svg viewBox="0 0 120 20" width="120" height="20"><path d="M0 10 Q 30 0, 60 10 T 120 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </div>
    <p data-i18n="footerText">¿Te interesa algún jabón? Escríbenos directo por WhatsApp.</p>
    <a id="footer-wa" class="footer-cta" href="#" target="_blank" rel="noopener"><svg class="icon"><use href="#icon-whatsapp"/></svg> <span data-i18n="footerCta">Contactar por WhatsApp</span></a>
    <div class="social-row">
      <a href="https://www.facebook.com/profile.php?id=61595298488203" target="_blank" rel="noopener" aria-label="Facebook de Jabones Licha"><svg class="icon"><use href="#icon-facebook"/></svg></a>
      <a href="https://www.instagram.com/jaboneslicha/" target="_blank" rel="noopener" aria-label="Instagram de Jabones Licha"><svg class="icon"><use href="#icon-instagram"/></svg></a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-content" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">&times;</button>
      <button class="lightbox-arrow prev" id="lightbox-prev" aria-label="Anterior">&#10094;</button>
      <img id="lightbox-img" src="" alt="">
      <button class="lightbox-arrow next" id="lightbox-next" aria-label="Siguiente">&#10095;</button>
      <div class="lightbox-info">
        <span class="tag" id="lightbox-tag">Jabón</span>
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-desc"></p>
        <a id="lightbox-order" class="order-btn" href="#" target="_blank" rel="noopener"><svg class="icon"><use href="#icon-whatsapp"/></svg> <span id="lightbox-order-label">Pedir por WhatsApp</span></a>
      </div>
    </div>
  </div>

  <a id="float-wa" class="float-wa" href="#" target="_blank" rel="noopener" aria-label="Pedir por WhatsApp">
    <svg class="icon" viewBox="0 0 24 24" width="28" height="28"><use href="#icon-whatsapp"/></svg>
  </a>
